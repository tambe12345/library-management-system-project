
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Admin Dashboard</h2>
    <div class="mt-4">
        <p><strong>Total Books:</strong> {{ total_books }}</p>
        <p><strong>Currently Borrowed Books:</strong> {{ borrowed_books }}</p>
    </div>

    <div class="mt-4">
        <a href="{% url 'add_book' %}" class="btn btn-success">Add New Book</a>
        <a href="{% url 'book_list' %}" class="btn btn-primary">Manage Books</a>
    </div>
</div>
</body>
</html>
