{% extends 'base.html' %}

{% block title %}Add Review{% endblock %}

{% block content %}
<body style="background-color:yellow" >
<div class="container mt-5 d-flex justify-content-center ">
  <div class="card shadow-sm p-4 rounded" style="max-width: 700px; width: 100%; background-color: #ffffff;">
    <h2 class="text-center mb-4">Add Review for "{{ book.title }}"</h2>

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label for="review" class="form-label">Your Review</label>
        <textarea id="review" name="review" rows="6" class="form-control" placeholder="Write your review..." required></textarea>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary btn-lg w-100">Submit Review</button>
      </div>
    </form>
  </div>
</div>
</body>
{% endblock %}

{% block extra_css %}
<style>

  .form-control:focus {

    border-color: #0d6efd;
    box-shadow: 0 0 5px rgba(13, 110, 253, 0.5);
  }
</style>
{% endblock %}
