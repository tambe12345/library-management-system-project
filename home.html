{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to the Library 📚</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f5f5f5;
    }
    .hero-section {
      background: url('https://images.unsplash.com/photo-1512820790803-83ca734da794?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80') no-repeat center center;
      background-size: cover;
      color: white;
      padding: 100px 0;
      text-align: center;
    }
    .login-card {
      max-width: 400px;
      margin: auto;
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    body{
    background-color:blue;
    }
  </style>
</head>
<body >

  <!-- Hero Section -->
  <section class="hero-section d-flex flex-column justify-content-center align-items-center">
    <h1 class="display-4 fw-bold">Welcome to the Library 📚</h1>
    <p class="lead">Explore books, manage your profile, and more.</p>

    <div class="mt-4 border border-2 p-5 rounded bg-light bg-opacity-25">
      <a href="{% url 'book_list' %}" class="btn btn-light btn-lg me-3">Browse Books</a><br><br>

      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}" class="btn btn-outline-light btn-lg">My Profile</a><br><br>
      {% endif %}

      <a href="{% url 'login' %}" class="btn btn-outline-light btn-lg">Login</a>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
