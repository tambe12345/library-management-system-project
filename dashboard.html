{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .dashboard-card {
      transition: transform 0.2s ease;
    }
    .dashboard-card:hover {
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Library Dashboard</a>
      <div class="d-flex">
        <a href="{% url 'logout' %}" class="btn btn-light">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <h2 class="mb-4">Welcome, {{ user.username }}!</h2>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card dashboard-card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Books</h5>
            <p class="card-text">View and manage the book collection.</p>
            <a href="{% url 'book_list' %}" class="btn btn-primary">Go to Books</a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card dashboard-card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Add Book</h5>
            <p class="card-text">Add a new book to the library system.</p>
            <a href="{% url 'add_book' %}" class="btn btn-success">Add Book</a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card dashboard-card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">My Profile</h5>
            <p class="card-text">View and update your profile.</p>
            <a href="{% url 'profile' %}" class="btn btn-info">Profile</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
