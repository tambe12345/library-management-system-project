
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if book %}Edit{% else %}Add{% endif %} Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<style>
    body{
    background-color:"yellow";
    }
</style>
<div class="container mt-5">
    <h2>{% if book %}Edit{% else %}Add{% endif %} Book</h2>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label>Title</label>
            <input type="text" name="title" class="form-control" value="{{ book.title|default_if_none:'' }}">
        </div>
        <div class="mb-3">
            <label>ISBN</label>
            <input type="text" name="isbn" class="form-control" value="{{ book.isbn|default_if_none:'' }}">
        </div>
        <div class="mb-3">
            <label>Available Copies</label>
            <input type="number" name="copies" class="form-control" value="{{ book.available_copies|default_if_none:1 }}">
        </div>
        <div class="mb-3">
            <label>Author</label>
            <select name="author" class="form-control">
                {% for author in authors %}
                    <option value="{{ author.id }}" {% if book and book.author.id == author.id %}selected{% endif %}>{{ author.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Category</label>
            <select name="category" class="form-control">
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if book and book.category.id == category.id %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">{% if book %}Update{% else %}Add{% endif %} Book</button>
    </form>

</div>
</body>
</html>
